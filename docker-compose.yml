name: junglegaming-wager

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: wager
      POSTGRES_PASSWORD: wager
      POSTGRES_DB: wager
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wager -d wager"]
      interval: 3s
      timeout: 3s
      retries: 20

  localstack:
    image: localstack/localstack:4
    environment:
      SERVICES: sqs
      DEBUG: "0"
      AWS_DEFAULT_REGION: us-east-1
    ports:
      - "4566:4566"
    volumes:
      - ./deploy/localstack/init-sqs.sh:/etc/localstack/init/ready.d/init-sqs.sh:ro
      - localstack:/var/lib/localstack
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:4566/_localstack/health | grep -q '\"sqs\"'"]
      interval: 3s
      timeout: 3s
      retries: 30

  keycloak:
    image: quay.io/keycloak/keycloak:26.2
    command:
      - start-dev
      - --import-realm
      - --http-port=8080
      - --health-enabled=true
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KC_HTTP_PORT: "8080"
      KC_HEALTH_ENABLED: "true"
      KC_HOSTNAME: "http://keycloak:8080"
      KC_HOSTNAME_STRICT: "false"
    ports:
      - "8090:8080"
      - "9000:9000"
    volumes:
      - ./deploy/keycloak/realm.json:/opt/keycloak/data/import/realm.json:ro
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/9000 && printf 'GET /health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && cat <&3 | grep -q '200 OK'"]
      interval: 5s
      timeout: 5s
      retries: 40

  migrate:
    build:
      context: .
    entrypoint: ["/usr/local/bin/migrate"]
    command: ["-command", "up"]
    environment:
      DATABASE_URL: postgres://wager:wager@postgres:5432/wager?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    build:
      context: .
    environment:
      APP_ENV: development
      LOG_LEVEL: info
      HTTP_ADDR: ":8080"
      DATABASE_URL: postgres://wager:wager@postgres:5432/wager?sslmode=disable
      MIGRATIONS_ENABLED: "false"
      AWS_REGION: us-east-1
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      SQS_ENDPOINT: http://localstack:4566
      OIDC_ISSUER_URL: http://keycloak:8080/realms/wager
      OIDC_AUDIENCE: wager-api
      WORKER_POLL_INTERVAL: 1s
      OUTBOX_POLL_INTERVAL: 1s
    ports:
      - "8080-8082:8080"
    depends_on:
      postgres:
        condition: service_healthy
      localstack:
        condition: service_healthy
      keycloak:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    stop_grace_period: 30s

  # Integration test runner. Runs inside the Compose network so it can use the
  # service hostnames; see README for host-side alternatives.
  tests:
    image: golang:1.27.1
    profiles: ["test"]
    working_dir: /src
    volumes:
      - .:/src
      - gomodcache:/go/pkg/mod
    environment:
      TEST_DATABASE_URL: postgres://wager:wager@postgres:5432/wager?sslmode=disable
      TEST_SQS_ENDPOINT: http://localstack:4566
      TEST_AWS_REGION: us-east-1
      TEST_AWS_ACCESS_KEY_ID: test
      TEST_AWS_SECRET_ACCESS_KEY: test
      TEST_OIDC_ISSUER_URL: http://keycloak:8080/realms/wager
      TEST_OIDC_AUDIENCE: wager-api
    depends_on:
      postgres:
        condition: service_healthy
      localstack:
        condition: service_healthy
      keycloak:
        condition: service_healthy
    command: ["go", "test", "-race", "-tags=integration", "-count=1", "-timeout", "10m", "./test/integration/..."]

volumes:
  pgdata:
  localstack:
  gomodcache:
